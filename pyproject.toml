[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voipy"
version = "0.1.0"
description = "Python library for real-time AI voice integration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
asterisk = []
openai = []
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/voipy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]
