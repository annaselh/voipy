[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voipy"
version = "0.1.0"
description = "Python library for real-time AI voice integration"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
asterisk = ["httpx>=0.27", "websockets>=13"]
freeswitch = []
openai = ["websockets>=13"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=.11"]

[tool.hatch.build.target.wheel]
packages = ["src/voipy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true